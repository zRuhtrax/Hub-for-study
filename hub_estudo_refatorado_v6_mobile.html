<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/><meta name="theme-color" content="#050505"/><title>Núcleo de Estudos</title><style>
:root{
  --bg:#0B1220;
  --bg-2:#111A2C;
  --bg-3:#18233A;
  --paper:#FAFAF7;
  --paper-2:#F2F1EB;
  --ink:#171B22;
  --ink-2:#374151;
  --muted:#5B6472;
  --muted-dark:#A8B2C3;
  --line:#D7DCE4;
  --line-dark:#2C3850;
  --accent:#7FA7FF;
  --accent-strong:#5E87E8;
  --accent-soft:#EAF0FF;
  --success:#23835A;
  --success-soft:#E3F3EB;
  --danger:#C64646;
  --danger-soft:#F8E4E4;
  --warning:#B77B19;
  --warning-soft:#FAF0DA;
  --shadow:0 12px 28px rgba(0,0,0,.16);
  --r-sm:9px;
  --r:13px;
  --r-lg:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit}
button{appearance:none;-webkit-appearance:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(127,167,255,.46);outline-offset:2px}
#app{min-height:100vh;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:18px 15px calc(106px + env(safe-area-inset-bottom));scroll-behavior:smooth}
.wrap{max-width:500px;margin:0 auto}

.study-title{font-family:Georgia,"Times New Roman",serif;color:var(--text);font-size:21px;line-height:1.2;margin:4px 0 5px}.study-title + .page-sub{color:var(--text-3)}
h1.page-title{font-family:Georgia,"Times New Roman",serif;color:var(--paper);font-size:25px;line-height:1.18;margin:4px 0 5px}
.page-sub{color:#C5CEDD;font-size:12.5px;margin:0 0 15px;line-height:1.52}
.backrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.backbtn{background:none;border:0;color:#C5CEDD;font-size:13px;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.backbtn:hover{color:#fff}
.btn{border:1px solid transparent;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:780;cursor:pointer;transition:transform .12s,background .12s,opacity .12s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--paper);color:var(--bg)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:#ffffff0d;border-color:#ffffff13;color:#F8FAFC}
.btn.ghost:hover{background:#ffffff16}
.btn.soft{background:var(--accent-soft);color:#4566A6}
.btn.soft:hover{background:#DFE8FF}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.reveal{background:var(--accent-strong);color:#fff;width:100%;margin-top:11px}
.card{background:var(--paper);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}

/* bottom navigation */
.tabbar{position:sticky;bottom:0;display:flex;background:rgba(8,13,23,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line-dark);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#8793A8;padding:7px 2px;cursor:pointer;font-size:10.5px;font-weight:700;position:relative;border-radius:10px}
.tab:hover{background:#ffffff09;color:#C7D0DE}
.tab svg{width:20px;height:20px}
.tab.active{color:#fff;background:#ffffff0a}
.tab.active::after{content:"";position:absolute;left:31%;right:31%;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
.tab .badge{position:absolute;top:1px;right:20%;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:9px;font-weight:850;display:flex;align-items:center;justify-content:center}

/* home */
.hero{margin:4px 0 18px}
.hero .eyebrow{color:#98B9FF;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.hero h1{font-family:Georgia,"Times New Roman",serif;color:var(--paper);font-size:30px;line-height:1.15;margin:4px 0 7px}
.hero p{color:#C5CEDD;font-size:13px;line-height:1.58;margin:0;max-width:44ch}
.focus-card{background:linear-gradient(135deg,#182743,#122038);border:1px solid #30415F;border-radius:var(--r-lg);padding:16px;margin-bottom:15px;box-shadow:0 18px 34px rgba(0,0,0,.14)}
.focus-kicker{font-size:10px;color:#98B9FF;text-transform:uppercase;letter-spacing:.08em;font-weight:850;margin-bottom:4px}
.focus-title{font-size:18px;color:#fff;font-weight:820;margin:0 0 4px}
.focus-meta{font-size:11.5px;color:#B5C1D3;line-height:1.45;margin-bottom:12px}
.focus-actions{display:flex;gap:8px}
.focus-actions .btn{flex:1}
.stat-row{display:flex;gap:8px;margin-bottom:18px}
.stat-box{flex:1;min-width:0;background:#ffffff08;border:1px solid #ffffff0d;border-radius:12px;padding:11px 8px;text-align:center}
.stat-box .n{font-family:Georgia,"Times New Roman",serif;font-size:21px;color:#fff;font-weight:750}
.stat-box .l{font-size:9.3px;color:#AEB9CA;margin-top:3px;letter-spacing:.05em;text-transform:uppercase}
.stat-box.hot .n{color:#F1C260}
.stat-box.due{cursor:pointer}
.stat-box.due:hover{background:#ffffff0d}
.section-h{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9DABC0;margin:18px 0 9px;font-weight:850}
.subject-card{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:9px;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.1);transition:transform .12s,box-shadow .12s}
.subject-card:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.subject-card:active{transform:scale(.989)}
.subject-card .badge-ic{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;flex:none}
.subject-card .badge-ic svg{width:21px;height:21px}
.subject-card .txt{flex:1;min-width:0}
.subject-card .txt h3{margin:0 0 3px;font-size:15px;line-height:1.22}
.subject-card .txt .tag{font-size:10.8px;color:var(--muted);margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-bar{height:6px;border-radius:5px;background:#DDE2E9;overflow:hidden}
.prog-bar>div{height:100%;background:var(--accent-strong);border-radius:5px}
.prog-label{font-size:10px;color:var(--muted);margin-top:4px}
.exam-chip{font-size:9.5px;font-weight:850;padding:4px 7px;border-radius:20px;background:var(--accent-soft);color:#46639B;white-space:nowrap}
.future-card{border:1px dashed #43516A;border-radius:12px;padding:13px 14px;color:#9EABBE;font-size:12px;line-height:1.5}

/* subject header and nav */
.subject-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.subject-header .subject-kicker{font-size:10px;color:#92A8C7;text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-bottom:3px}
.subject-header .subject-name{font-size:18px;font-weight:820;color:#fff}
.exam-inline{display:flex;align-items:center;gap:8px;margin:7px 0 5px;flex-wrap:wrap}
.exam-inline .lbl{font-size:10.8px;color:#A7B3C4}
.exam-inline input[type=date]{background:#ffffff0d;border:1px solid #ffffff16;color:#fff;border-radius:8px;padding:7px 9px;font-size:12px}
.segctrl{display:flex;background:#ffffff08;border:1px solid #ffffff0c;border-radius:12px;padding:3px;margin:13px 0 11px;gap:3px}
.segctrl button{flex:1;border:0;background:none;padding:9px 5px;border-radius:9px;font-size:11.7px;font-weight:800;color:#A8B3C4;cursor:pointer}
.segctrl button.active{background:var(--paper);color:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* topic index */
.learning-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.learning-pill{background:#ffffff07;border:1px solid #ffffff0d;border-radius:11px;padding:9px 10px}
.learning-pill .k{font-size:9.3px;color:#98A6BA;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.learning-pill .v{font-size:12px;color:#fff;font-weight:750;margin-top:2px;line-height:1.25}
.seeall-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent-strong);color:#fff;border-radius:12px;padding:12px;margin-bottom:13px;font-weight:780;font-size:13px;cursor:pointer;box-shadow:0 8px 18px rgba(94,135,232,.18)}
.seeall-btn:hover{background:#6F96EF}
.topic-row{display:flex;align-items:center;gap:11px;background:var(--paper);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer;box-shadow:0 4px 13px rgba(0,0,0,.075)}
.topic-row:hover{background:#fffdf8}
.topic-num{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:850;font-size:11px;flex:none}
.topic-row .t{flex:1;min-width:0}
.topic-row .t h4{margin:0 0 3px;font-size:13.7px;line-height:1.25}
.topic-row .t p{margin:0;font-size:10.8px;color:var(--muted);line-height:1.36}
.topic-row .chev{color:#667084;display:flex;flex:none}
.topic-row .chev svg{width:17px;height:17px}

/* didactic topic content */
.topic-content{font-size:14px}
.topic-content p{font-size:14px;line-height:1.68;margin:0 0 12px;color:var(--ink)}
.topic-content strong{color:#13171D}
.topic-content ul{margin:0 0 13px;padding-left:20px}
.topic-content li{font-size:14px;line-height:1.6;margin-bottom:6px;color:var(--ink)}
.topic-content h4{font-size:14px;color:#3F5F9C;margin:19px 0 7px;line-height:1.3}
.idea-box,.why-box,.connection-box,.warning-box{border-radius:11px;padding:12px 13px;margin:13px 0}
.idea-box{background:#EEF3FF;border:1px solid #D6E1FF}
.why-box{background:#EDF6F1;border:1px solid #D4EBDD}
.connection-box{background:#F5F3EA;border:1px solid #E5E0CF}
.warning-box{background:var(--warning-soft);border:1px solid #ECDCB7}
.idea-box .k,.why-box .k,.connection-box .k,.warning-box .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:850;margin-bottom:4px;color:#5D6F95}
.why-box .k{color:#3C7259}.connection-box .k{color:#71623A}.warning-box .k{color:#7A5A20}
.idea-box p,.why-box p,.connection-box p,.warning-box p{font-size:13px;line-height:1.55;margin:0}
.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0 14px}
.concept{border:1px solid var(--line);background:#FFFDF8;border-radius:10px;padding:11px}
.concept .t{font-size:11px;font-weight:850;color:#465A7B;margin-bottom:3px}
.concept .d{font-size:11.5px;line-height:1.42;color:var(--ink-2)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0 14px}
.compare{border:1px solid var(--line);border-radius:11px;padding:11px;background:#FFFDF8}
.compare .head{font-size:11.5px;font-weight:850;margin-bottom:5px}
.compare.good .head{color:#236D4C}.compare.bad .head{color:#7E3A3A}
.compare .line{font-size:11.7px;line-height:1.48;color:var(--ink-2)}
.cause-chain{display:flex;flex-direction:column;gap:0;margin:12px 0 15px}
.cause-step{position:relative;background:#FFFDF8;border:1px solid var(--line);padding:10px 11px;border-radius:10px}
.cause-step strong{display:block;font-size:12px;margin-bottom:2px}
.cause-step span{display:block;font-size:11.4px;color:var(--ink-2);line-height:1.42}
.cause-link{height:16px;display:flex;align-items:center;justify-content:center;color:#697384;font-size:14px;font-weight:850}
.callout-quote{border-left:3px solid var(--accent-strong);padding:7px 11px;background:#F1F5FE;color:#2B426D;font-size:13px;line-height:1.55;border-radius:0 8px 8px 0;margin:12px 0}
.topic-content .tip{background:var(--warning-soft);border-left:3px solid var(--warning);padding:10px 11px;border-radius:8px;font-size:13px;line-height:1.52}
.diagram{margin:15px 0 16px;text-align:center;border:1px solid var(--line);background:#FFFDF9;border-radius:12px;padding:10px}
.diagram svg{display:block;width:100%;height:auto}
.diagram-cap{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.miniquiz-head{margin-top:22px;padding-top:15px;border-top:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#4D5868;font-weight:850}
.mini-q{margin-top:12px}
.mini-q .qt{font-size:13px;font-weight:750;line-height:1.45;margin-bottom:8px}
.mini-opt{display:block;width:100%;text-align:left;border:1.4px solid var(--line);background:#FFFEFB;border-radius:9px;padding:9px 10px;font-size:12.8px;margin-bottom:6px;cursor:pointer;color:var(--ink);line-height:1.4}
.mini-opt:hover{background:#FBFAF5}
.mini-opt.correct{background:var(--success-soft);border-color:var(--success);font-weight:750}.mini-opt.wrong{background:var(--danger-soft);border-color:var(--danger);font-weight:750}.mini-opt.disabled{pointer-events:none}
.mini-explain{font-size:12px;color:var(--ink-2);background:var(--paper-2);padding:8px 9px;border-radius:8px;margin-top:4px;line-height:1.48}
.topic-nav{display:flex;gap:9px;margin-top:21px}.topic-nav .btn{flex:1}

/* questions */
.question-shell{margin-top:5px}
.q-meta{font-size:10.5px;color:#AEB9C9;line-height:1.4;margin-bottom:4px}
.progress{display:flex;gap:4px;margin:8px 0 9px}.progress span{flex:1;height:4px;border-radius:3px;background:#ffffff19}.progress span.done{background:var(--success)}.progress span.current{background:var(--accent)}
.qcard .tag-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
.kind{font-size:9.5px;font-weight:850;padding:4px 9px;border-radius:20px}.kind.mc{background:var(--accent-soft);color:#4B69A4}.kind.explain{background:var(--warning-soft);color:#87611C}
.q-text{font-size:16px;font-weight:680;line-height:1.46;margin-bottom:14px;white-space:pre-line}
.options{display:flex;flex-direction:column;gap:8px}.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:#FFFEFB;border-radius:10px;padding:11px 12px;font-size:13.5px;color:var(--ink);cursor:pointer;line-height:1.42}.opt:hover{background:#FCFAF4}.opt.correct{background:var(--success-soft);border-color:var(--success);color:#205E42;font-weight:750}.opt.wrong{background:var(--danger-soft);border-color:var(--danger);color:#732B2B;font-weight:750}.opt.disabled{pointer-events:none;opacity:.58}.opt.disabled.correct,.opt.disabled.wrong{opacity:1}
.explain-box{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--paper-2);font-size:12.8px;line-height:1.54;color:var(--ink-2);border-left:3px solid var(--warning)}
textarea{width:100%;min-height:92px;border-radius:10px;border:1.5px solid var(--line);background:#FFFEFB;padding:10px 11px;font-size:13.5px;color:var(--ink);resize:vertical;line-height:1.46}
.answer-quality{font-size:10px;color:var(--muted);margin-top:7px}
.model-answer{margin-top:11px;padding:12px 13px;border-radius:10px;background:#EDF2FF;border-left:3px solid var(--accent-strong);font-size:13px;line-height:1.58}.model-answer .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5E719A;margin-bottom:6px;font-weight:850}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.term-chip{font-size:10px;padding:4px 8px;border-radius:20px;background:#DFE7FA;color:#4B5F88;font-weight:750}
.rate-row{display:flex;gap:8px;margin-top:13px}.rate-btn{flex:1;border:1px solid transparent;border-radius:10px;padding:10px 8px;font-size:12px;font-weight:800;cursor:pointer}.rate-btn.good{background:var(--success-soft);color:#245E44;border-color:#CBE5D8}.rate-btn.bad{background:var(--danger-soft);color:#762D2D;border-color:#EBCBCB}.rate-btn.selected{outline:2px solid currentColor;outline-offset:-2px}
.nav{display:flex;gap:9px;margin-top:15px}.nav .btn{flex:1}
.summary .big{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:750;color:#18202A;margin:4px 0 2px;text-align:center}.summary .lbl{font-size:11.5px;color:var(--muted);text-align:center;letter-spacing:.03em}.summary .msg{font-size:13.2px;margin:13px 0;color:var(--ink);line-height:1.52;text-align:center}.review-list .h{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:13px 0 6px;font-weight:850}.review-item{font-size:12.3px;padding:8px 10px;border-radius:8px;background:var(--danger-soft);margin-bottom:6px;color:#762D2D}.review-item.ok{background:var(--success-soft);color:#245E44}

/* review */
.review-intro{background:#ffffff08;border:1px solid #ffffff0d;border-radius:12px;padding:12px 13px;margin-bottom:12px}.review-intro .big{font-size:16px;color:#fff;font-weight:820}.review-intro .small{font-size:11.2px;color:#AEB8C9;line-height:1.48;margin-top:2px}
.review-mode-row{display:flex;gap:8px;margin-bottom:13px}.mode-chip{flex:1;text-align:center;padding:9px 7px;border-radius:10px;font-size:11.5px;font-weight:780;cursor:pointer;background:#ffffff09;border:1px solid #ffffff0d;color:#B0BBCB}.mode-chip:hover{background:#ffffff10}.mode-chip.active{background:var(--paper);color:var(--bg)}
.empty-state{text-align:center;padding:35px 16px;color:#AEB8C9;font-size:13px;line-height:1.6}.empty-state .big-ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;background:#ffffff0a;border:1px solid #ffffff10;color:#fff}
.flip-area{perspective:1400px;cursor:pointer;min-height:206px}.flip-inner{position:relative;width:100%;min-height:186px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1)}.flip-inner.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:5px 3px}.face.back{transform:rotateY(180deg)}.face .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:850}.face .content{font-size:18px;line-height:1.46;font-weight:680;color:var(--ink)}.face.back .content{font-size:14.6px;font-weight:450;line-height:1.56}.tap-hint{text-align:center;font-size:10.5px;color:var(--muted);margin-top:8px}.flash-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diff{font-size:9.5px;font-weight:850;padding:4px 8px;border-radius:20px}.diff.facil{background:var(--success-soft);color:var(--success)}.diff.medio{background:var(--warning-soft);color:var(--warning)}.diff.dificil{background:var(--danger-soft);color:var(--danger)}.box-chip{font-size:9.5px;font-weight:800;padding:4px 7px;border-radius:20px;background:#E5E9F0;color:#586273;white-space:nowrap}
.kw-item{background:var(--paper);border-radius:12px;padding:12px 13px;margin-bottom:8px;box-shadow:0 4px 12px rgba(0,0,0,.07)}.kw-item .term{font-size:14px;font-weight:780;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;cursor:pointer}.kw-item .term .chev{color:#667084;display:flex;transition:transform .18s}.kw-item .term .chev svg{width:16px;height:16px}.kw-item.open .term .chev{transform:rotate(90deg)}.kw-item .def{font-size:12.7px;color:var(--ink-2);line-height:1.52;margin-top:9px;display:none}.kw-item.open .def{display:block}

/* due & stats */
.due-hero{background:#ffffff08;border:1px solid #ffffff0d;border-radius:var(--r);padding:14px;margin-bottom:15px}.due-hero .n{font-family:Georgia,"Times New Roman",serif;font-size:28px;color:#fff;font-weight:750}.due-hero .c{font-size:11.3px;color:#AEB8C9;margin-top:2px}.due-group{margin-bottom:17px}.due-group h3{font-size:13px;color:#fff;margin:0 0 8px}.due-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffff08;border:1px solid #ffffff0d;border-radius:11px;padding:11px 12px}.due-row .n{font-size:12.8px;color:#fff}.due-row .c{font-size:11px;color:#9FAABD;margin-top:2px}.due-row .btn{white-space:nowrap}

/* ==========================================================
   REFINED THEME - 60:30:10 + CONTRAST SYSTEM
   60% chrome/background · 30% reading surfaces · 10% accent
   ========================================================== */
:root{
  --bg:#0B1220;
  --bg-2:#131D2E;
  --bg-3:#1B2940;

  /* 30% reading surface */
  --surface:#F8FAFC;
  --surface-2:#EEF2F7;
  --surface-3:#E4EAF2;
  --text:#111827;
  --text-2:#334155;
  --text-3:#475569;
  --border:#CBD5E1;
  --border-soft:#E2E8F0;

  /* 10% accent */
  --accent:#5B67D8;
  --accent-strong:#4652BF;
  --accent-hover:#3945AA;
  --accent-soft:#E8EBFF;
  --accent-contrast:#FFFFFF;

  /* semantic states */
  --success:#176B48;
  --success-soft:#E4F4EC;
  --danger:#A83232;
  --danger-soft:#F9E6E6;
  --warning:#7A5615;
  --warning-soft:#FBF0D8;

  --chrome-text:#F8FAFC;
  --chrome-text-2:#CBD5E1;
  --chrome-text-3:#A8B3C3;
  --chrome-border:#2A3850;
  --shadow:0 10px 26px rgba(2,6,23,.12);
}

/* Make every interactive element inherit the system */
body{background:var(--bg);color:var(--chrome-text)}
.scroll{background:var(--bg)}
.wrap{color:var(--chrome-text)}
.page-sub,.backbtn{color:var(--chrome-text-2)}
.section-h{color:var(--chrome-text-3)}
.hero p,.focus-meta,.future-card{color:var(--chrome-text-2)}

/* Light reading surface: the main fix for explanation readability */
.study-surface{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--surface-3);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}
.study-surface .page-sub{color:var(--text-3)}
.study-surface .backbtn{color:var(--text-2)}
.study-surface .topic-content,
.study-surface .mini-q,
.study-surface .miniquiz-head{color:var(--text)}

.topic-content p,
.topic-content li,
.topic-content .concept .d,
.topic-content .compare .line,
.topic-content .cause-step span,
.topic-content .diagram-cap,
.mini-q .qt{
  color:var(--text);
}
.topic-content p,
.topic-content li{color:#172033}
.topic-content strong{color:#0B1020}
.topic-content h4{color:#3047A0}
.topic-content .concept .t{color:#344A87}
.topic-content .compare .line{color:var(--text-2)}
.topic-content .cause-step span{color:var(--text-2)}
.topic-content .diagram-cap{color:var(--text-3)}

/* Calls to action / section accents */
.idea-box{background:#EEF1FF;border-color:#CBD2FF}
.idea-box .k{color:#3847A0}
.why-box{background:#E8F5EF;border-color:#C8E5D6}
.why-box .k{color:#176B48}
.connection-box{background:#F1F4F8;border-color:#D9E0E8}
.connection-box .k{color:#475569}
.warning-box{background:var(--warning-soft);border-color:#E9D8AE}
.warning-box .k{color:var(--warning)}
.callout-quote{background:#EFF2FF;border-left-color:var(--accent);color:#27357A}

/* Diagrams live inside the reading surface, so use high-contrast neutrals */
.diagram{background:#FFFFFF;border-color:#CBD5E1}
.diagram-cap{color:#475569}
.diagram text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;paint-order:stroke;stroke-width:0}

/* Cards in review/question flows */
.card,.subject-card,.topic-row,.kw-item{background:var(--surface);color:var(--text)}
.subject-card .txt .tag,
.topic-row .t p,
.prog-label{color:var(--text-3)}
.topic-row .chev{color:#526174}
.exam-chip{background:var(--accent-soft);color:#3344A0;border:1px solid #CDD3FF}

/* Inputs on dark chrome */
.exam-inline input[type=date]{background:#162238;color:var(--chrome-text);border-color:#3A4960}
.exam-inline .lbl{color:var(--chrome-text-2)}

/* Segmented controls */
.segctrl{background:#162238;border-color:#2A3850}
.segctrl button{color:#B9C5D5}
.segctrl button.active{background:var(--surface);color:var(--bg)}

/* Review controls */
.mode-chip{background:#162238;color:#B9C5D5;border:1px solid #2A3850}
.mode-chip.active{background:var(--surface);color:var(--bg);border-color:var(--surface-3)}

/* Accessible states */
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid #A8B2FF;
  outline-offset:3px;
}

/* Never let muted text become too weak */
.muted,.muted-text{color:var(--text-3)!important}
.empty-state{color:var(--chrome-text-2)}

/* Better small labels on light surfaces */
.study-surface .miniquiz-head{color:#3D4A5B;border-top-color:#D4DBE4}
.study-surface .mini-opt{color:var(--text);background:#FFFFFF;border-color:#CBD5E1}
.study-surface .mini-opt:hover{background:#F4F7FA}
.study-surface .mini-explain{background:#F1F4F8;color:var(--text-2);border-left-color:var(--accent)}

/* Questions are reading surfaces too */
.qcard .q-text,
.qcard textarea,
.qcard .opt,
.summary{color:var(--text)}
.qcard .opt{background:#FFFFFF;border-color:#CBD5E1}
.qcard .opt.disabled{color:#475569}
.qcard .explain-box,.model-answer{color:var(--text-2)}

/* Stats / progress labels */
.stats-card{color:var(--text)}
.stats-card .head span,.stats-caption,.progress-note{color:var(--text-3)}

/* Responsive reading measure */
.study-surface .topic-content{max-width:68ch}
@media (min-width:700px){
  .wrap{max-width:760px}
  .study-surface{padding:26px 30px}
}

.topic-nav{gap:7px;margin-top:18px;position:sticky;bottom:0;background:linear-gradient(to top,#fff 65%,rgba(255,255,255,0));padding-top:11px;padding-bottom:1px}
.topic-nav .btn{min-height:46px;padding:9px 10px;font-size:12px}

/* practice */
.question-shell{margin-top:2px}
.qcard{padding:15px!important;border-radius:14px!important}
.qcard .tag-row{margin-bottom:10px}
.kind{font-size:8.8px;padding:4px 8px}
.q-meta{font-size:9.5px}
.q-text{font-size:16px;line-height:1.43;margin-bottom:13px}
.options{gap:7px}
.opt{min-height:50px;padding:11px 11px;font-size:13px;line-height:1.4;border-radius:10px}
.explain-box{font-size:12.2px;line-height:1.5;padding:10px 11px}
textarea{min-height:118px;padding:11px;font-size:13.2px}
.model-answer{font-size:12.4px;line-height:1.52;padding:11px 12px}
.terms{gap:5px}.term-chip{font-size:9.4px;padding:4px 7px}
.rate-row{gap:6px;margin-top:11px}.rate-btn{min-height:48px;font-size:11.5px}
.nav{gap:7px;margin-top:12px}.nav .btn{min-height:46px;font-size:12px}

/* review / flashcards */
.review-intro{padding:11px 12px;margin-bottom:10px}
.review-intro .big{font-size:15px}.review-intro .small{font-size:10.7px;line-height:1.45}
.review-mode-row{gap:6px;margin-bottom:10px}
.mode-chip{min-height:42px;padding:8px 5px;font-size:10.5px}
.empty-state{padding:30px 13px;font-size:12.5px}
.flip-area{min-height:245px}
.flip-inner{min-height:225px}
.face{padding:6px 4px}
.face .label{font-size:9.2px;margin-bottom:8px}
.face .content{font-size:18px;line-height:1.43}
.face.back .content{font-size:14px;line-height:1.52}
.tap-hint{font-size:9.7px;margin-top:7px}
.flash-actions{gap:6px}
.flash-actions .btn{min-height:48px;font-size:11.5px}
.kw-item{padding:11px 11px;margin-bottom:6px;border-radius:11px}
.kw-item .term{font-size:13.3px;grid-template-columns:minmax(0,1fr) auto auto}
.kw-item .def{font-size:12.2px;line-height:1.48}

/* due / stats */
.due-hero{padding:12px 13px;margin-bottom:12px}
.due-hero .n{font-size:27px}.due-hero .c{font-size:10.8px}
.due-group{margin-bottom:14px}.due-group h3{font-size:12.2px;margin-bottom:7px}
.due-row{padding:10px;border-radius:10px}
.due-row .n{font-size:12.2px}.due-row .c{font-size:10.4px}
.due-row .btn{min-height:40px;padding:7px 9px;font-size:11px}
.stats-overview{gap:6px;margin-bottom:12px}
.stats-tile{padding:10px 5px;border-radius:10px;min-height:68px}
.stats-tile .n{font-size:18px}.stats-tile .l{font-size:8px}
.stats-card{padding:12px;border-radius:13px;margin-bottom:8px}
.stats-card .head strong{font-size:13px}.stats-card .head span{font-size:10.5px}
.bar-grid{gap:4px;height:56px}.bar-labels{gap:4px}.bar-labels div{font-size:8.8px}
.progress-note{font-size:10.5px;padding:8px 9px}

/* bottom navigation */
.tabbar{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;transform:translateX(-50%);padding:5px 5px calc(5px + env(safe-area-inset-bottom));min-height:64px;border-top:1px solid #24252A;box-shadow:0 -10px 30px rgba(0,0,0,.42)}
.tab{min-height:50px;gap:3px;padding:6px 2px;font-size:10px;border-radius:9px}
.tab svg{width:21px;height:21px}
.tab.active::after{left:29%;right:29%;bottom:1px}
.tab .badge{top:0;right:18%;min-width:17px;height:17px;font-size:8.5px}

/* iOS/Android safe areas and very narrow phones */
@media(max-width:360px){
  .scroll{padding-left:10px;padding-right:10px}
  .hero h1{font-size:26px}
  .hero p{font-size:12px}
  .stat-box .l{font-size:7.6px}
  .subject-card .badge-ic{width:38px;height:38px}
  .topic-row{height:82px;min-height:82px;padding:9px}
  .topic-row .t h4{font-size:12.7px}
  .topic-row .t p{font-size:9.8px}
  .study-surface{padding-left:13px!important;padding-right:13px!important}
  .study-title{font-size:20px}
  .qcard{padding:13px!important}
  .q-text{font-size:15.5px}
  .flip-area{min-height:230px}.flip-inner{min-height:210px}
}

/* Larger displays only frame the dedicated mobile build like a phone */
@media(min-width:431px){
  body{display:flex;justify-content:center}
  #app{box-shadow:0 0 0 1px #17171B,0 20px 80px rgba(0,0,0,.65)}
}

const SUBJECTS=[{
 id:"climatologia",name:"Climatologia",tag:"Geografia · Capítulo 3",icon:ICON.globe,
 learningGoal:"Entender como energia, atmosfera e circulação produzem diferentes climas.",
 topics:[
  {id:"clima-tempo",title:"Clima × Tempo",sub:"Comece distinguindo evento momentâneo de padrão de longo prazo",html:`
    ${svgClimateVsWeather()}
    <div class="idea-box"><div class="k">Ideia central</div><p><strong>Tempo</strong> descreve o estado da atmosfera em determinado momento e lugar. <strong>Clima</strong> descreve padrões estatísticos do tempo observados ao longo de períodos longos. Um episódio de chuva é tempo; a recorrência de chuva em uma região faz parte do clima.</p></div>
    <p>Essa distinção evita um erro muito comum: usar um dia frio, uma onda de calor ou uma chuva intensa isolada como se, sozinhos, definissem a mudança do clima. O clima não apaga a variabilidade; ele procura padrões dentro dela.</p>
    <h4>Como os dois se conectam</h4>
    <div class="cause-chain"><div class="cause-step"><strong>1. O tempo acontece</strong><span>Temperatura, pressão, umidade, vento e precipitação variam diariamente.</span></div><div class="cause-link">↓</div><div class="cause-step"><strong>2. Muitos tempos são observados</strong><span>Décadas de medições permitem comparar médias, extremos e frequência de eventos.</span></div><div class="cause-link">↓</div><div class="cause-step"><strong>3. Surge uma descrição climática</strong><span>O clima resume padrões e variabilidade, não uma previsão para um dia específico.</span></div></div>
    <div class="why-box"><div class="k">Por que isso importa?</div><p>Previsão do tempo responde “o que pode acontecer nos próximos dias?”. Climatologia responde “quais padrões e faixas de variação são típicos deste lugar ao longo de muitos anos?”. As duas áreas usam observações atmosféricas, mas fazem perguntas diferentes.</p></div>
    <div class="connection-box"><div class="k">Conexão com os próximos módulos</div><p>Os <strong>elementos do clima</strong> são as variáveis que medimos. Os <strong>fatores climáticos</strong> ajudam a explicar por que essas variáveis diferem de lugar para lugar. A <strong>dinâmica atmosférica</strong> explica como o sistema se movimenta.</p></div>
  `,quiz:[
   {q:"Uma cidade registra 34 °C, vento forte e chuva no fim da tarde de hoje. Isso é principalmente um exemplo de:",options:["clima da cidade","tempo atmosférico","fator climático","classificação climática"],correct:1,explain:"É uma descrição do estado da atmosfera em um momento específico. Para falar de clima, precisamos olhar padrões de longo prazo."},
   {q:"Por que um único evento extremo não basta, sozinho, para definir o clima de uma região?",options:["Porque o clima não possui extremos","Porque clima descreve padrões e variabilidade ao longo de muitos anos","Porque eventos extremos nunca podem ser medidos","Porque o clima só depende da latitude"],correct:1,explain:"Um evento isolado faz parte do tempo meteorológico. A climatologia procura padrões estatísticos e mudanças na frequência ou intensidade dos eventos ao longo do tempo."},
   {type:"mc",q:"Qual comparação melhor separa tempo de clima?",options:["tempo descreve médias de décadas; clima descreve uma tarde","tempo descreve um estado momentâneo; clima resume padrões de longo prazo","tempo depende apenas da temperatura; clima apenas da chuva","não existe diferença prática"],correct:1,explain:"A escala temporal e o tratamento estatístico distinguem os dois conceitos."},
   {type:"mc",challenge:true,q:"Uma cidade passa por três verões muito quentes. O que ainda seria necessário para avaliar se há mudança climática persistente?",options:["apenas observar o próximo dia","uma série mais longa de dados e comparação com a variabilidade esperada","ignorar temperatura e olhar apenas vento","considerar somente um evento extremo"],correct:1,explain:"Tendências climáticas exigem séries longas e contexto estatístico."},
   {type:"open",q:"Explique por que “hoje está quente” e “o clima é quente” são afirmações de naturezas diferentes.",explain:"A primeira descreve o estado da atmosfera em um momento específico. A segunda resume um padrão construído a partir de muitos registros ao longo do tempo."}]},
  {id:"elementos",title:"Elementos do Clima",sub:"Aprenda a ler um clima como um conjunto de variáveis",html:`
    <div class="concept-grid"><div class="concept"><div class="t">Temperatura</div><div class="d">Indica o estado térmico do ar.</div></div><div class="concept"><div class="t">Umidade</div><div class="d">Mostra a presença de vapor d’água na atmosfera.</div></div><div class="concept"><div class="t">Precipitação</div><div class="d">Água que chega à superfície em forma líquida ou sólida.</div></div><div class="concept"><div class="t">Pressão</div><div class="d">Relaciona-se ao peso do ar e às diferenças que ajudam a gerar ventos.</div></div></div>
    <h4>Temperatura não é apenas uma média</h4><p>A <strong>amplitude térmica</strong> é a diferença entre valores de temperatura, como máxima e mínima de um período. Dois locais podem ter médias parecidas e, ainda assim, comportamentos muito diferentes ao longo do dia ou do ano.</p>${svgTemperatureAmplitude()}
    <h4>Umidade relativa: o contexto importa</h4><p>Umidade relativa é uma medida percentual da quantidade de vapor presente em relação ao máximo que o ar consegue conter naquela temperatura. Como a capacidade de retenção depende da temperatura, a mesma quantidade de vapor pode corresponder a um percentual diferente em momentos diferentes.</p>
    <h4>Precipitação: pense no mecanismo</h4><ul><li><strong>Frontal:</strong> associada à interação entre massas de ar de características diferentes.</li><li><strong>Orográfica:</strong> o relevo força o ar úmido a subir.</li><li><strong>Convectiva:</strong> o aquecimento favorece a subida do ar, formando nuvens convectivas.</li></ul>
    <h4>Pressão e vento</h4>${svgPressure()}<p>Em uma explicação simplificada, o vento está ligado às diferenças de pressão: o ar tende a se mover de regiões de maior pressão para regiões de menor pressão. A rotação da Terra e o relevo também interferem na direção real do escoamento.</p>
    <div class="connection-box"><div class="k">Conexão</div><p>Quando você junta temperatura + umidade + pressão + movimento do ar, começa a sair da lista de definições e a enxergar <strong>mecanismos atmosféricos</strong>.</p></div>

   {q:"Por que 70% de umidade relativa não significa sempre a mesma quantidade de vapor d’água?",options:["Porque a porcentagem não tem relação com temperatura","Porque a capacidade do ar de conter vapor depende da temperatura","Porque o vapor desaparece à noite","Porque a pressão é sempre zero"],correct:1,explain:"A umidade relativa é uma razão: a quantidade presente é comparada com a capacidade máxima, que muda com a temperatura."},
   {q:"Que mecanismo descreve melhor uma chuva que ocorre depois que ar úmido é obrigado a subir uma serra?",options:["frontal","orográfica","convectiva exclusivamente","maritimidade"],correct:1,explain:"O relevo funciona como barreira e força a ascensão do ar, favorecendo resfriamento e condensação."},
   {type:"mc",q:"Qual exemplo representa amplitude térmica e não temperatura média?",options:["23 °C como média anual","18 °C pela manhã e 31 °C à tarde","78% de umidade relativa","1013 hPa de pressão"],correct:1,explain:"Amplitude é uma diferença entre valores de temperatura."},
   {type:"mc",q:"Em uma tarde muito quente, por que a umidade relativa pode cair mesmo sem remover vapor d’água do ar?",options:["porque a capacidade de retenção aumenta com a temperatura","porque a água deixa de existir","porque pressão e umidade relativa são a mesma coisa","porque a temperatura não afeta a capacidade do ar"],correct:0,explain:"Ao aquecer, o ar pode conter mais vapor; com a mesma quantidade presente, a razão percentual pode diminuir."},
   {type:"open",q:"Compare chuva frontal, orográfica e convectiva pelo mecanismo que faz o ar subir.",explain:"Frontal: a interação entre massas de ar favorece a ascensão. Orográfica: o relevo força o ar a subir. Convectiva: o aquecimento da superfície favorece a ascensão do ar aquecido."}]},
  {id:"atmosfera",title:"Camadas da Atmosfera",sub:"Localize os processos antes de tentar explicá-los",html:`
    ${svgAtmosphere()}
    <p>A atmosfera não é uniforme. Suas propriedades mudam com a altitude, e por isso costuma ser dividida em <strong>troposfera, estratosfera, mesosfera, termosfera e exosfera</strong>.</p>
    <ul><li><strong>Troposfera:</strong> é a camada mais próxima da superfície e a principal região dos fenômenos meteorológicos.</li><li><strong>Estratosfera:</strong> concentra a maior parte do ozônio atmosférico, importante na absorção de radiação ultravioleta.</li><li><strong>Mesosfera:</strong> é uma região em que muitos meteoroides queimam por atrito.</li><li><strong>Termosfera:</strong> recebe forte influência da energia solar e está associada a fenômenos como auroras.</li><li><strong>Exosfera:</strong> é extremamente rarefeita e faz uma transição gradual para o espaço.</li></ul>
    <div class="warning-box"><div class="k">Cuidado com uma simplificação</div><p>As camadas não são “caixas totalmente separadas”. Os limites são regiões de transição, e fenômenos como a ionosfera atravessam partes de mais de uma camada.</p></div>
    <h4>Composição não é o mesmo que camadas</h4><p>As cinco camadas são classificadas principalmente pela estrutura vertical da atmosfera. Já a composição básica do ar perto da superfície é dominada por nitrogênio e oxigênio, além de pequenas quantidades de outros gases e vapor d’água.</p>
    <div class="why-box"><div class="k">Por que isso ajuda na climatologia?</div><p>Porque evita procurar mecanismos climáticos na parte errada da atmosfera. O tempo meteorológico que sentimos na superfície está fortemente ligado à troposfera, onde existe a maior parte da massa de ar e do vapor d’água atmosférico.</p></div>
  `,quiz:[
   {q:"Em qual camada ocorrem os fenômenos meteorológicos que estudamos no dia a dia?",options:["estratosfera","troposfera","mesosfera","exosfera"],correct:1,explain:"A troposfera é a camada diretamente ligada ao tempo meteorológico."},
   {q:"Qual associação está correta?",options:["estratosfera — maior parte do ozônio","mesosfera — camada mais próxima do solo","troposfera — auroras como fenômeno dominante","exosfera — maior parte do vapor d’água"],correct:0,explain:"A maior parte do ozônio atmosférico está concentrada na estratosfera, enquanto o tempo ocorre principalmente na troposfera."},
   {type:"mc",q:"Qual sequência coloca as camadas na ordem correta, da superfície para o espaço?",options:["Estratosfera → Troposfera → Mesosfera → Exosfera → Termosfera","Troposfera → Estratosfera → Mesosfera → Termosfera → Exosfera","Troposfera → Mesosfera → Estratosfera → Termosfera → Exosfera","Exosfera → Termosfera → Mesosfera → Estratosfera → Troposfera"],correct:1,explain:"Essa é a ordem vertical usada na classificação das cinco camadas principais."},
   {type:"mc",q:"Qual associação está correta?",options:["estratosfera — maior concentração de ozônio","mesosfera — principal camada do tempo meteorológico","troposfera — camada das auroras","exosfera — maior parte do vapor d’água"],correct:0,explain:"O ozônio atmosférico está concentrado principalmente na estratosfera; o tempo ocorre principalmente na troposfera."},
   {type:"open",challenge:true,q:"Relacione a posição das camadas ao tipo de fenômeno predominante que estudamos em cada uma, sem apenas listar os nomes.",explain:"A troposfera concentra o tempo meteorológico; a estratosfera é importante pelo ozônio; a mesosfera é associada à queima de muitos meteoroides; a termosfera recebe forte energia solar e está ligada às auroras; a exosfera é extremamente rarefeita e transicional."}]},
  {id:"fatores",title:"Fatores Climáticos",sub:"Por que lugares diferentes recebem e distribuem energia de modos diferentes",html:`
    ${svgRadiationAndFactors()}
    <p>Agora fazemos a pergunta mais importante: <strong>por que dois lugares da Terra podem ter climas diferentes?</strong> Os fatores climáticos alteram a maneira como a energia é recebida, armazenada ou redistribuída.</p>
    <h4>Latitude</h4><p>Quanto maior a latitude, em geral mais inclinada é a incidência média da radiação solar. A mesma energia tende a se distribuir por uma área maior, reduzindo a energia recebida por unidade de área.</p>
    <h4>Altitude</h4><p>Com o aumento da altitude, a pressão atmosférica diminui. Em condições usuais da troposfera, a temperatura também tende a cair com a altitude.</p>
    <h4>Maritimidade e continentalidade</h4><p>A água tem grande capacidade de armazenar calor. Como o oceano responde mais lentamente ao aquecimento e ao resfriamento, regiões próximas ao mar tendem a ter variações térmicas menores que áreas continentais comparáveis.</p>
    <h4>Albedo</h4><p>É a capacidade de uma superfície refletir radiação. Superfícies mais claras costumam refletir mais; superfícies escuras tendem a absorver mais energia. Isso interfere no balanço de energia.</p>
    <h4>Correntes marítimas</h4><p>Correntes deslocam grandes quantidades de calor e podem alterar temperatura e umidade das áreas costeiras. Correntes frias ajudam a explicar a aridez de algumas costas subtropicais, enquanto correntes quentes podem favorecer maior disponibilidade de umidade.</p>
    <div class="connection-box"><div class="k">Pense em mecanismo, não em lista</div><p>Latitude altera a <strong>entrada de energia</strong>; altitude altera <strong>pressão e temperatura</strong>; o mar altera o <strong>ritmo do aquecimento e do resfriamento</strong>; correntes redistribuem <strong>calor</strong>; albedo altera a <strong>reflexão</strong>. O clima resulta da interação.</p></div>
  `,quiz:[
   {q:"Por que a proximidade do oceano tende a reduzir a amplitude térmica?",options:["porque o mar não recebe radiação","porque a água armazena e libera calor mais lentamente que a terra","porque o ar do litoral não tem vapor","porque a latitude diminui perto da praia"],correct:1,explain:"A grande capacidade térmica da água ajuda a amortecer variações de temperatura."},
   {q:"Uma superfície com albedo alto tende a:",options:["absorver toda a radiação incidente","refletir uma fração maior da radiação incidente","aumentar automaticamente a umidade","criar baixa pressão por definição"],correct:1,explain:"Albedo mede a fração refletida: quanto maior o albedo, maior tende a ser a reflexão."},
   {q:"Qual explicação é mais completa para um deserto costeiro influenciado por corrente fria?",options:["o oceano sozinho impede qualquer nuvem","a água fria reduz evaporação e o contexto atmosférico favorece pouca precipitação","a corrente fria aumenta a convecção continuamente","desertos costeiros sempre estão em altas latitudes"],correct:1,explain:"A corrente fria reduz o fornecimento de vapor por evaporação e atua junto de outros controles atmosféricos e geográficos."},
   {type:"mc",q:"Dois lugares recebem a mesma energia solar média, mas um reflete muito mais radiação por ter superfície clara. Qual fator está mudando?",options:["continentalidade","albedo","altitude","umidade relativa"],correct:1,explain:"Albedo descreve a fração da radiação incidente que é refletida."},
   {type:"mc",q:"Qual combinação explica melhor uma amplitude térmica menor no litoral?",options:["maritimidade + grande capacidade térmica da água","alta continentalidade + baixa capacidade térmica da água","maior latitude + ausência de oceano","alto albedo + falta de vapor"],correct:0,explain:"A água armazena e libera calor lentamente, amortecendo variações de temperatura."},
   {type:"open",challenge:true,q:"Explique como latitude, albedo e maritimidade podem alterar a temperatura por mecanismos diferentes.",explain:"Latitude altera a geometria média da entrada de energia; albedo altera quanto dessa energia é refletida; maritimidade altera o ritmo com que a superfície oceânica armazena e devolve calor."}]},
  {id:"dinamica",title:"Dinâmica Climática",sub:"Conecte pressão, circulação, células e frentes",html:`
    <div class="idea-box"><div class="k">Pergunta-guia</div><p>Se o clima é um sistema em movimento, <strong>como o ar se desloca e organiza?</strong> A chave está nas diferenças de pressão e na circulação em várias escalas.</p></div>
    <h4>Ciclone e anticiclone</h4><div class="compare-grid"><div class="compare good"><div class="head">Ciclone</div><div class="line">baixa pressão relativa, convergência de ar na superfície, movimento ascendente e maior chance de nuvens e precipitação.</div></div><div class="compare"><div class="head">Anticiclone</div><div class="line">alta pressão relativa, ar descendente e circulação que tende a favorecer condições mais estáveis e secas.</div></div></div>
    <p>A palavra “ciclone” não significa automaticamente “furacão”. Ciclone pode ser usado para sistemas de baixa pressão em diferentes contextos; <strong>ciclone tropical</strong> é um tipo específico.</p>
    <h4>Circulação geral</h4>${svgCirculation()}<p>O aquecimento desigual da superfície ajuda a criar movimentos verticais e horizontais. Em escala planetária, esse processo participa da organização das células de Hadley, Ferrel e Polar.</p>
    <h4>ZCIT</h4><p>A Zona de Convergência Intertropical é uma faixa onde os ventos alísios dos dois hemisférios convergem. O ar quente e úmido tende a subir nessa região, favorecendo convecção e chuva.</p>
    <h4>Frentes</h4>${svgFronts()}<p>Frentes são zonas de transição entre massas de ar. Uma frente fria ocorre quando o ar frio avança e desloca o ar quente; uma frente quente ocorre quando o ar quente avança sobre o ar frio. A forma como o ar sobe ajuda a explicar diferenças na nebulosidade e na precipitação.</p>
    <div class="why-box"><div class="k">Conexão forte</div><p><strong>diferença de aquecimento → diferença de pressão → movimento do ar → convergência/divergência → subida/descida → nuvens e chuva.</strong> Essa cadeia aparece novamente no El Niño e nos ciclones tropicais.</p></div>
  `,quiz:[
   {q:"Qual sequência explica melhor a formação de um ambiente favorável à instabilidade em um sistema de baixa pressão?",options:["ar desce → seca → alta pressão","convergência → subida do ar → resfriamento/condensação → nuvens","alta pressão → ar converge → ausência de nuvens","frente → ausência de vapor → chuva"],correct:1,explain:"A convergência favorece subida. O ar que sobe se expande e esfria, podendo atingir saturação e formar nuvens."},
   {q:"Por que a ZCIT costuma ser uma região chuvosa?",options:["porque é uma faixa de alta pressão","porque os alísios convergem e favorecem a subida de ar quente e úmido","porque não recebe radiação solar","porque o ar sempre desce no Equador"],correct:1,explain:"A convergência dos alísios favorece movimento ascendente, convecção e formação de nuvens de desenvolvimento vertical."},
   {q:"O que caracteriza uma frente fria?",options:["ar quente avança sobre ar frio","ar frio avança e desloca o ar quente","uma corrente marítima substitui uma massa de ar","um anticiclone fica estacionário"],correct:1,explain:"Frente fria é a borda de avanço de uma massa de ar mais fria sobre uma mais quente."},
   {type:"mc",q:"Em um sistema de baixa pressão, qual sequência é mais coerente?",options:["ar desce → divergência → estabilidade","ar converge → sobe → resfria → condensação pode favorecer nuvens","ar desce → baixa pressão → chuva por definição","pressão não tem relação com movimento do ar"],correct:1,explain:"A baixa pressão favorece convergência próxima à superfície e movimento ascendente, embora o resultado dependa do contexto."},
   {type:"mc",q:"Qual associação está correta?",options:["anticiclone — baixa pressão e ar ascendente","ciclone — alta pressão e ar descendente","ZCIT — convergência dos alísios e forte convecção","frente quente — avanço de ar frio por baixo do ar quente"],correct:2,explain:"A ZCIT é uma faixa de convergência dos alísios com forte movimento ascendente."},
   {type:"open",challenge:true,q:"Conecte pressão, vento e chuva em uma cadeia causal usando pelo menos quatro etapas.",explain:"Diferenças de pressão contribuem para mover o ar; a convergência pode favorecer ascensão; o ar ascendente resfria; ao atingir saturação, ocorre condensação e podem surgir nuvens e precipitação."}]},
  {id:"elnino",title:"El Niño e La Niña",sub:"Veja o clima como um sistema oceano-atmosfera acoplado",html:`
    ${svgENSO()}
    <p>El Niño e La Niña são fases do <strong>ENSO</strong> (El Niño–Oscilação Sul), um fenômeno de grande escala que conecta o estado do oceano tropical do Pacífico com mudanças na circulação atmosférica.</p>
    <h4>Condições próximas do normal</h4><p>Os ventos alísios normalmente empurram águas superficiais mais quentes para oeste. Perto da costa oeste da América do Sul, o processo de ressurgência ajuda a trazer águas mais frias e ricas em nutrientes para a superfície.</p>
    <h4>El Niño</h4><p>Durante El Niño, as águas superficiais do Pacífico equatorial central e leste ficam anormalmente quentes. Isso altera os ventos, a distribuição da convecção e os padrões de chuva.</p>
    <h4>La Niña</h4><p>La Niña é a fase fria: o Pacífico equatorial central e leste fica anormalmente mais frio, enquanto a circulação de ventos e a ressurgência se fortalecem.</p>
    <div class="callout-quote">O ponto central não é “El Niño = quente”. É: <strong>mudou a temperatura do oceano → mudou a atmosfera → mudaram circulação, chuva e temperatura em regiões distantes.</strong></div>
    <div class="connection-box"><div class="k">Brasil: cuidado com respostas automáticas</div><p>Existem padrões típicos para várias regiões do Brasil, mas eles são <strong>tendências</strong>, não uma regra mecânica para cada cidade e cada episódio. A resposta local depende da época do ano, da região e da interação com outros sistemas atmosféricos.</p></div>
  `,quiz:[
   {q:"O que melhor define o El Niño?",options:["resfriamento global do planeta","aquecimento anômalo do Pacífico equatorial central e leste com mudanças na circulação atmosférica","um ciclone tropical no Atlântico","aumento da camada de ozônio"],correct:1,explain:"El Niño é uma fase quente do ENSO e envolve acoplamento entre oceano e atmosfera."},
   {q:"Por que El Niño e La Niña podem afetar lugares muito distantes do Pacífico?",options:["porque a água do oceano viaja até todos os continentes","porque alterações oceânicas mudam padrões de circulação atmosférica em grande escala","porque a latitude do planeta muda","porque a radiação solar deixa de existir"],correct:1,explain:"A atmosfera redistribui energia e umidade em grande escala; mudanças no Pacífico podem reorganizar padrões de circulação e precipitação em regiões distantes."},
   {type:"mc",q:"Qual descrição representa melhor o El Niño?",options:["resfriamento anômalo do Pacífico equatorial e ausência de resposta atmosférica","aquecimento anômalo do Pacífico equatorial central/leste acompanhado por mudanças na circulação","um ciclone tropical no Atlântico Sul","uma mudança permanente na temperatura global"],correct:1,explain:"El Niño é uma fase quente do ENSO e envolve acoplamento entre oceano e atmosfera."},
   {type:"mc",q:"Por que os efeitos do El Niño no Brasil não são idênticos em todas as regiões?",options:["porque ENSO não afeta o Brasil","porque a resposta depende da região, da estação e da interação com outros padrões atmosféricos","porque o Pacífico não influencia a atmosfera","porque todo El Niño produz exatamente a mesma chuva"],correct:1,explain:"As teleconexões variam no espaço e no tempo e interagem com outros sistemas."},
   {type:"open",challenge:true,q:"Explique como uma anomalia no oceano pode produzir mudanças de chuva em uma região distante sem que a água do Pacífico chegue até lá.",explain:"A mudança oceânica altera a circulação atmosférica em grande escala. Essa circulação redistribui energia e umidade e modifica padrões de convergência, subsidência e precipitação em regiões distantes."}]},
  {id:"ciclones",title:"Ciclones Tropicais",sub:"Entenda a retroalimentação entre oceano quente e atmosfera",html:`
    ${svgTropicalCyclone()}
    <p>Um <strong>ciclone tropical</strong> é um sistema organizado de baixa pressão que se desenvolve em ambiente tropical e utiliza energia do oceano quente. “Furacão” e “tufão” são nomes regionais usados para ciclones tropicais que atingem determinada intensidade em diferentes bacias.</p>
    <h4>O mecanismo</h4><p>Água quente fornece energia por evaporação. O vapor sobe, condensa e libera calor latente. Esse aquecimento sustenta convecção, ajuda a aprofundar a circulação e reforça a organização do sistema.</p>
    <p>A temperatura do oceano é importante, mas <strong>não é suficiente sozinha</strong>. Um ambiente favorável também envolve umidade, pouca variação vertical dos ventos, uma perturbação inicial e distância suficiente do Equador para que o efeito de Coriolis contribua para a organização da circulação. Uma referência comum é água do mar em torno de <strong>26,5 °C ou mais</strong>, em profundidade suficiente.</p>
    <h4>Tornado e ciclone tropical não são a mesma coisa</h4><div class="compare-grid"><div class="compare"><div class="head">Ciclone tropical</div><div class="line">sistema de grande escala, alimentado principalmente pelo calor do oceano, com duração que pode se estender por vários dias.</div></div><div class="compare"><div class="head">Tornado</div><div class="line">coluna de ar em rotação muito menor e de duração geralmente muito mais curta, associada a tempestades severas.</div></div></div>
    <div class="warning-box"><div class="k">Erro comum</div><p>“Água a 26 °C = vai formar furacão” está errado. Temperatura do mar é uma condição importante, não um gatilho único.</p></div>
  `,quiz:[
   {q:"Qual cadeia mostra melhor o mecanismo de intensificação de um ciclone tropical?",options:["água fria → menos evaporação → alta pressão","água quente → evaporação → convecção/condensação → liberação de calor → fortalecimento da circulação","água quente → ausência de vapor → ar desce","frente fria → camada de ozônio → furacão"],correct:1,explain:"A energia liberada pela condensação do vapor ajuda a sustentar a convecção e a circulação do sistema."},
   {q:"Por que dizer apenas “o mar precisa estar quente” é uma explicação incompleta?",options:["porque a temperatura do mar nunca importa","porque outros fatores atmosféricos e a rotação da Terra também influenciam a formação","porque ciclones nascem apenas sobre terra","porque o oceano não fornece energia"],correct:1,explain:"Umidade, cisalhamento vertical, perturbação inicial e Coriolis também são relevantes."},
   {type:"mc",q:"Qual etapa fornece uma fonte importante de energia para a intensificação de um ciclone tropical?",options:["resfriamento extremo do oceano","evaporação e posterior liberação de calor na condensação","ausência de vapor d’água","atrito com o solo seco"],correct:1,explain:"A evaporação transporta energia para a atmosfera; a condensação libera calor latente e sustenta a convecção."},
   {type:"mc",q:"Por que um ciclone tropical não se organiza facilmente exatamente sobre o Equador?",options:["porque não existe oceano","porque o efeito de Coriolis é muito pequeno perto do Equador","porque o ar não pode subir no Equador","porque a temperatura é sempre zero"],correct:1,explain:"O efeito de Coriolis precisa contribuir para organizar a circulação giratória."},
   {type:"open",challenge:true,q:"Diferencie tornado e ciclone tropical usando escala, fonte de energia e duração, sem depender apenas do tamanho.",explain:"Ciclones tropicais são sistemas de grande escala que usam principalmente energia do oceano quente e podem durar dias. Tornados são fenômenos menores e muito mais curtos, associados a tempestades severas e dinâmica diferente."}]},
  {id:"mudancas",title:"Mudanças Climáticas",sub:"Conecte balanço de energia, ação humana e riscos",html:`
    ${svgGreenhouse()}${svgClimateChangeChain()}
    <p>O efeito estufa natural faz parte do funcionamento térmico do planeta. O problema atual é o <strong>aumento da concentração de gases de efeito estufa devido principalmente a atividades humanas</strong>, alterando o balanço de energia da Terra.</p>
    <h4>De onde vem o aumento?</h4><ul><li>queima de carvão, petróleo e gás;</li><li>mudanças no uso da terra e desmatamento;</li><li>agropecuária e outras fontes de metano e óxido nitroso;</li><li>processos industriais e manejo de resíduos.</li></ul>
    <h4>O que muda?</h4><p>O aquecimento do sistema climático altera médias e distribuições de temperatura, disponibilidade de água, gelo, nível do mar e o risco de alguns extremos. O efeito não é idêntico em todos os lugares: vulnerabilidade e impactos dependem da região e das características sociais e ambientais.</p>
    <h4>Por que eventos extremos precisam de contexto?</h4><p>Um evento específico resulta da combinação de circulação atmosférica, oceano, relevo, uso da terra e outras condições. A mudança climática pode alterar o pano de fundo que influencia frequência ou intensidade de alguns extremos, mas não significa que cada evento extremo tenha uma causa única.</p>
    <h4>Política climática</h4><p>O <strong>Protocolo de Kyoto</strong> estabeleceu metas de redução para países desenvolvidos dentro de um sistema internacional específico. O <strong>Acordo de Paris</strong> de 2015 organizou compromissos nacionais chamados NDCs e estabeleceu o objetivo de manter o aquecimento global bem abaixo de 2 °C e perseguir esforços para limitá-lo a 1,5 °C.</p>
    <div class="why-box"><div class="k">Conexão com tudo que veio antes</div><p>Latitude, altitude, circulação, oceano, umidade, correntes e balanço de energia continuam presentes. A diferença é que agora estamos alterando <strong>forçantes do sistema climático</strong>, especialmente a composição atmosférica.</p></div>
  `,quiz:[
   {q:"Qual cadeia causal é mais adequada para explicar o aquecimento global antropogênico?",options:["mais chuva → menos CO₂ → aquecimento","atividades humanas → mais gases de efeito estufa → maior retenção de energia → aquecimento do sistema","mais vento → mais ozônio → aquecimento","menos vapor d’água → mais reflexão → aquecimento"],correct:1,explain:"A emissão e o aumento da concentração de gases de efeito estufa alteram o balanço energético e levam ao aquecimento do sistema climático."},
   {q:"Qual afirmação evita uma simplificação comum sobre eventos extremos?",options:["cada evento extremo é causado diretamente por uma única causa","mudança climática significa que todos os eventos ficarão iguais","um evento específico depende das condições locais e da circulação, enquanto mudanças climáticas podem alterar o contexto de risco","clima não influencia extremos"],correct:2,explain:"Atribuição de extremos é uma questão de contexto e probabilidade, não de causa única automática."}
  ]}
 ],
 questions:[
  {type:"mc",title:"Tempo × clima",q:"Uma pessoa diz: “Hoje fez muito frio, então o clima da cidade está mudando.” Qual é o problema lógico?",options:["frio nunca é parte do clima","um dia isolado descreve tempo; para inferir mudança climática é preciso analisar séries e padrões de longo prazo","clima só pode ser estudado no inverno","temperatura não é elemento climático"],correct:1,explain:"Um estado diário pertence ao tempo meteorológico. Mudança climática é avaliada por alterações persistentes em médias, distribuição e extremos ao longo do tempo."},

const BOX_INTERVAL_DAYS=[1,2,4,8,16];
const DAY_MS=86400000;
function pad2(n){return String(n).padStart(2,"0")}
function localDateKey(d=new Date()){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function todayStr(){return localDateKey()}
function addDays(dateStr,days){const [y,m,d]=dateStr.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+days);return localDateKey(dt)}
function daysBetween(fromStr,toStr){const [fy,fm,fd]=fromStr.split("-").map(Number);const [ty,tm,td]=toStr.split("-").map(Number);return Math.round((new Date(ty,tm-1,td)-new Date(fy,fm-1,fd))/DAY_MS)}

let srsBySubject={};
let meta={examDates:{},stats:{streakDays:0,lastActiveDate:null,totalReviews:0}};
let storageReady=false;
async function safeGet(key){try{if(window.storage?.get){const r=await window.storage.get(key,false);return r?JSON.parse(r.value):null}const raw=localStorage.getItem("hub:"+key);return raw?JSON.parse(raw):null}catch(e){return null}}
async function safeSet(key,value){try{if(window.storage?.set){await window.storage.set(key,JSON.stringify(value),false);return}localStorage.setItem("hub:"+key,JSON.stringify(value))}catch(e){}}
function blankSubjectSrs(){return{flashcards:{},keywords:{}}}
async function loadAll(){const m=await safeGet("meta");if(m)meta={...meta,...m,examDates:{...(m.examDates||{})},stats:{...meta.stats,...(m.stats||{})}};for(const s of SUBJECTS){const d=await safeGet("srs:"+s.id);srsBySubject[s.id]={...blankSubjectSrs(),...(d||{}),flashcards:{...((d&&d.flashcards)||{})},keywords:{...((d&&d.keywords)||{})}}}storageReady=true}
function getItemState(subjectId,kind,itemId){const bucket=srsBySubject[subjectId]?.[kind];return bucket?.[itemId]||{box:0,next:todayStr()}}
function isDue(st){return !st||st.next<=todayStr()}
async function rateItem(subjectId,kind,itemId,good){if(!srsBySubject[subjectId])srsBySubject[subjectId]=blankSubjectSrs();const bucket=srsBySubject[subjectId][kind];const cur=bucket[itemId]||{box:0,next:todayStr()};const box=good?Math.min(cur.box+1,BOX_INTERVAL_DAYS.length-1):0;const next=good?addDays(todayStr(),BOX_INTERVAL_DAYS[box]):addDays(todayStr(),1);bucket[itemId]={box,next};await safeSet("srs:"+subjectId,srsBySubject[subjectId]);await bumpStats()}
async function bumpStats(){const t=todayStr();if(meta.stats.lastActiveDate!==t){meta.stats.streakDays=meta.stats.lastActiveDate===addDays(t,-1)?(meta.stats.streakDays||0)+1:1;meta.stats.lastActiveDate=t}meta.stats.totalReviews=(meta.stats.totalReviews||0)+1;await safeSet("meta",meta)}
async function setExamDate(subjectId,dateStr){meta.examDates[subjectId]=dateStr||null;await safeSet("meta",meta)}
function daysUntil(dateStr){return dateStr?daysBetween(todayStr(),dateStr):null}
function subjectDueCounts(subjectId){const s=SUBJECTS.find(x=>x.id===subjectId),b=srsBySubject[subjectId]||blankSubjectSrs();return [...s.flashcards.map(f=>({k:"flashcards",id:f.id})),...s.keywords.map(k=>({k:"keywords",id:k.id}))].filter(it=>isDue(b[it.k][it.id])).length}
function totalDueCount(){return SUBJECTS.reduce((n,s)=>n+subjectDueCounts(s.id),0)}
function allItems(subject){return [...subject.flashcards.map(f=>({kind:"flashcards",id:f.id})),...subject.keywords.map(k=>({kind:"keywords",id:k.id}))]}
function subjectMasteryPct(subjectId){const s=SUBJECTS.find(x=>x.id===subjectId),b=srsBySubject[subjectId]||blankSubjectSrs(),items=allItems(s);if(!items.length)return 0;return Math.round(items.filter(it=>b[it.kind][it.id]?.box>=3).length/items.length*100)}
function subjectReviewReady(subjectId){const s=SUBJECTS.find(x=>x.id===subjectId),b=srsBySubject[subjectId]||blankSubjectSrs();return{flash:s.flashcards.filter(f=>isDue(b.flashcards[f.id])).length,keywords:s.keywords.filter(k=>isDue(b.keywords[k.id])).length}}
