  const prev=state.topicIdx>0?'<button class="btn ghost" id="prevTopic">Anterior</button>':'<span></span>';
  const next=state.seqMode?(isLast?'Concluir':'Próximo módulo'):'Voltar aos módulos';
  container.innerHTML=`<article class="study-surface"><div class="backrow"><button class="backbtn" id="backList">Módulos</button></div><div class="module-progress">Módulo ${state.topicIdx+1} de ${s.topics.length}</div><h1 class="study-title">${state.topicIdx+1}. ${t.title}</h1><p class="page-sub">${t.sub}</p><div class="topic-content">${t.html}</div><div class="miniquiz-head">Teste de entendimento · ${t.quiz.length} questões</div><p class="quiz-intro">As primeiras verificam a fixação do módulo; as últimas exigem conexão, interpretação ou transferência quando isso fizer sentido.</p><div id="miniQuizWrap"></div><div class="topic-nav">${prev}<button class="btn primary" id="nextTopic">${next}</button></div></article>`;
  const wrap=container.querySelector('#miniQuizWrap');
  t.quiz.forEach((mq,qi)=>{
    const block=document.createElement('div'); block.className='mini-q';
    const typeLabel=mq.type==='open'?'Resposta curta':(mq.challenge?'Integração':'Fixação');
    if(mq.type==='open'){
      block.innerHTML=`<div class="q-kind">${qi+1}. ${typeLabel}</div><div class="qt">${mq.q}</div><textarea class="mini-open" placeholder="Explique com suas próprias palavras..."></textarea><button class="btn soft mini-reveal">Comparar com uma resposta-modelo</button><div class="mini-exp-slot"></div>`;
      block.querySelector('.mini-reveal').addEventListener('click',()=>{block.querySelector('.mini-exp-slot').innerHTML=`<div class="mini-explain"><strong>Resposta-modelo:</strong> ${mq.explain}</div>`});
    }else{
      block.innerHTML=`<div class="q-kind">${qi+1}. ${typeLabel}</div><div class="qt">${mq.q}</div><div>${mq.options.map((o,i)=>`<button class="mini-opt" data-oi="${i}">${o}</button>`).join('')}</div><div class="mini-exp-slot"></div>`;
      const opts=block.querySelectorAll('.mini-opt'),slot=block.querySelector('.mini-exp-slot');
      opts.forEach(btn=>btn.addEventListener('click',()=>{
        if(block.dataset.answered)return; block.dataset.answered='1'; const picked=Number(btn.dataset.oi);
        opts.forEach(b=>{const i=Number(b.dataset.oi);b.classList.add('disabled');if(i===mq.correct)b.classList.add('correct');else if(i===picked)b.classList.add('wrong')});
        slot.innerHTML=`<div class="mini-explain">${mq.explain}</div>`;
      }));
    }
    wrap.appendChild(block);
  });
  container.querySelector('#backList').addEventListener('click',()=>{state.explainView='list';state.seqMode=false;render();});
  if(container.querySelector('#prevTopic'))container.querySelector('#prevTopic').addEventListener('click',()=>{state.topicIdx--;state.flashFlipped=false;render();requestAnimationFrame(()=>document.querySelector('.scroll')?.scrollTo(0,0))});
  container.querySelector('#nextTopic').addEventListener('click',()=>{if(state.seqMode&&!isLast){state.topicIdx++;render();requestAnimationFrame(()=>document.querySelector('.scroll')?.scrollTo(0,0))}else{state.explainView='list';state.seqMode=false;render();}});
}

function renderQuestionsInto(container,s){const Q=s.questions;if(state.qIdx>=Q.length){renderQuestionsSummaryInto(container,s);return}const item=Q[state.qIdx],answered=state.qAnswered[state.qIdx],progress=Q.map((_,i)=>`<span class="${i<state.qIdx?"done":i===state.qIdx?"current":""}"></span>`).join("");container.innerHTML=`<div class="question-shell"><div class="q-meta">Questão ${state.qIdx+1} de ${Q.length} · ${item.title}</div><div class="progress">${progress}</div><div class="card qcard"><div class="q-meta">${item.type==="explain"?"Raciocínio explicado":"Múltipla escolha"}</div><div id="qBody"></div></div></div>`;const qBody=container.querySelector("#qBody");item.type==="explain"?renderExplainQuestion(item,qBody):renderMcQuestion(item,qBody)}
function renderMcQuestion(item,container){const already=state.qAnswered[state.qIdx];container.innerHTML=`<div class="q-text">${item.q}</div><div class="options" id="optionsWrap">${item.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><div id="explainSlot"></div><div class="nav"><button class="btn ghost" id="btnBack" ${state.qIdx===0?"disabled":""}>Voltar</button><button class="btn primary" id="btnNext" ${already?"":"disabled"}>Próxima</button></div>`;const wrap=container.querySelector("#optionsWrap"),slot=container.querySelector("#explainSlot");const lock=picked=>{wrap.querySelectorAll(".opt").forEach(b=>{const i=Number(b.dataset.i);b.classList.add("disabled");if(i===item.correct)b.classList.add("correct");else if(i===picked)b.classList.add("wrong")});slot.innerHTML=`<div class="explain-box"><strong>Por que?</strong><br>${item.explain}</div>`};if(already)lock(already.picked);wrap.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>{if(state.qAnswered[state.qIdx])return;const picked=Number(btn.dataset.i),isCorrect=picked===item.correct;state.qAnswered[state.qIdx]={picked,isCorrect};if(isCorrect)state.qCorrect++;lock(picked);container.querySelector("#btnNext").disabled=false}));container.querySelector("#btnNext").addEventListener("click",()=>{state.qIdx++;render()});container.querySelector("#btnBack").addEventListener("click",()=>{state.qIdx--;render()})}
function renderExplainQuestion(item,container){const already=state.qAnswered[state.qIdx];container.innerHTML=`<div class="q-text">${item.q}</div><textarea id="userAnswer" placeholder="Escreva com suas próprias palavras antes de ver a resposta modelo...">${already?.text||""}</textarea><div class="answer-quality">Evite copiar definições: tente explicar relações de causa e efeito.</div><button class="btn reveal" id="btnReveal">${already?.revealed?"Resposta já revelada":"Ver resposta modelo"}</button><div id="modelSlot"></div><div class="nav"><button class="btn ghost" id="btnBack" ${state.qIdx===0?"disabled":""}>Voltar</button><button class="btn primary" id="btnNext" ${already?.rating?"":"disabled"}>Próxima</button></div>`;const textarea=container.querySelector("#userAnswer"),slot=container.querySelector("#modelSlot"),next=container.querySelector("#btnNext");const highlight=r=>{container.querySelectorAll(".rate-btn").forEach(b=>b.classList.toggle("selected",b.dataset.r===r))};const rate=r=>{const cur=state.qAnswered[state.qIdx]||{};cur.rating=r;cur.text=textarea.value;state.qAnswered[state.qIdx]=cur;highlight(r);next.disabled=false};const show=()=>{slot.innerHTML=`<div class="model-answer"><div class="lbl">Resposta modelo</div>${item.model}<div class="terms">${item.terms.map(t=>`<span class="term-chip">${t}</span>`).join("")}</div></div><div class="rate-row"><button class="rate-btn bad" data-r="bad">Preciso revisar</button><button class="rate-btn good" data-r="good">Consegui explicar</button></div>`;const cur=state.qAnswered[state.qIdx]||{};cur.revealed=true;cur.text=textarea.value;state.qAnswered[state.qIdx]=cur;container.querySelectorAll(".rate-btn").forEach(b=>b.addEventListener("click",()=>rate(b.dataset.r)));if(cur.rating)highlight(cur.rating)};if(already?.revealed)show();container.querySelector("#btnReveal").addEventListener("click",show);next.addEventListener("click",()=>{const cur=state.qAnswered[state.qIdx]||{};cur.text=textarea.value;state.qAnswered[state.qIdx]=cur;state.qIdx++;render()});container.querySelector("#btnBack").addEventListener("click",()=>{state.qIdx--;render()})}
function renderQuestionsSummaryInto(container,s){const Q=s.questions,mc=Q.filter(x=>x.type!=="explain"),ex=Q.filter(x=>x.type==="explain"),goodEx=Q.filter((x,i)=>x.type==="explain"&&state.qAnswered[i]?.rating==="good").length,pct=mc.length?state.qCorrect/mc.length:0;const msg=pct>=.8&&goodEx>=Math.max(0,ex.length-1)?"Você está construindo boas conexões causais.":pct>=.5?"A estrutura está razoável; volte aos pontos em que confundiu mecanismo e resultado.":"Faça uma segunda passada pelo conteúdo e tente explicar os mecanismos em voz alta.";const rows=Q.map((it,i)=>{const a=state.qAnswered[i];const ok=it.type==="explain"?a?.rating==="good":a?.isCorrect;return `<div class="review-item ${ok?"ok":""}">${it.title} · ${ok?"compreendido":"vale revisar"}</div>`}).join("");container.innerHTML=`<div class="card summary"><div class="lbl">Questões objetivas certas</div><div class="big">${state.qCorrect}/${mc.length}</div><div class="lbl" style="margin-top:12px">Explicações que você conseguiu sustentar</div><div class="big" style="font-size:24px">${goodEx}/${ex.length}</div><div class="msg">${msg}</div><div class="review-list"><div class="h">Mapa dos resultados</div>${rows}</div><div class="nav"><button class="btn ghost" id="btnBack">Rever</button><button class="btn primary" id="btnRestart">Refazer</button></div></div>`;container.querySelector("#btnRestart").addEventListener("click",()=>{state.qIdx=0;state.qAnswered={};state.qCorrect=0;render()});container.querySelector("#btnBack").addEventListener("click",()=>{state.qIdx=Math.max(0,Q.length-1);render()})}

function buildQueue(s,kind,filter){const items=kind==="flashcards"?s.flashcards:s.keywords,b=srsBySubject[s.id]?.[kind]||{};return items.filter(it=>filter==="all"||isDue(b[it.id]))}
function startFlashQueue(s){state.flashQueue=buildQueue(s,"flashcards",state.reviewFilter);state.flashPos=0;state.flashFlipped=false}
function renderReviewInto(container,s){const r=subjectReviewReady(s.id);if(state.reviewSub==="menu"){container.innerHTML=`<div class="review-intro"><div class="big">Revisar é recuperar, não reler.</div><div class="small">Primeiro tente lembrar. Só depois veja a resposta e decida o que precisa voltar à memória.</div></div><div class="subject-card" id="goFlash"><div class="badge-ic" style="background:var(--accent-soft);color:var(--accent-strong)">${ICON.card}</div><div class="txt"><h3>Flashcards</h3><div class="tag">${s.flashcards.length} cards · ${r.flash} para hoje</div></div></div><div class="subject-card" id="goKw"><div class="badge-ic" style="background:#F1F4F8;color:#475569">${ICON.key}</div><div class="txt"><h3>Conceitos e termos</h3><div class="tag">${s.keywords.length} conceitos · ${r.keywords} para hoje</div></div></div>`;container.querySelector("#goFlash").addEventListener("click",()=>{state.reviewSub="flash";state.reviewFilter="due";startFlashQueue(s);render()});container.querySelector("#goKw").addEventListener("click",()=>{state.reviewSub="keywords";state.reviewFilter="due";render()})}else if(state.reviewSub==="flash")renderFlashInto(container,s);else renderKeywordsInto(container,s)}
function renderFlashInto(container,s){const q=state.flashQueue.length?state.flashQueue:buildQueue(s,"flashcards",state.reviewFilter);if(!state.flashQueue.length&&state.reviewFilter==="all")state.flashQueue=q;container.innerHTML=`<div class="backrow"><button class="backbtn" id="backMenu">Revisar</button><span class="page-sub" style="margin:0">${state.reviewFilter==="due"?"pendentes":"todos"}</span></div><div class="review-mode-row"><button class="mode-chip ${state.reviewFilter==="due"?"active":""}" id="modeDue">Hoje (${buildQueue(s,"flashcards","due").length})</button><button class="mode-chip ${state.reviewFilter==="all"?"active":""}" id="modeAll">Todos (${s.flashcards.length})</button></div><div id="flashBody"></div>`;container.querySelector("#backMenu").addEventListener("click",()=>{state.reviewSub="menu";render()});container.querySelector("#modeDue").addEventListener("click",()=>{state.reviewFilter="due";startFlashQueue(s);render()});container.querySelector("#modeAll").addEventListener("click",()=>{state.reviewFilter="all";startFlashQueue(s);render()});const body=container.querySelector("#flashBody");if(!q.length){body.innerHTML=`<div class="empty-state"><div class="big-ic">${ICON.check}</div>${state.reviewFilter==="due"?"Nenhum card pendente hoje.":"Nenhum flashcard cadastrado."}<br><br><button class="btn soft" id="backToReview">Voltar</button></div>`;body.querySelector("#backToReview").addEventListener("click",()=>{state.reviewSub="menu";render()});return}if(state.flashPos>=q.length){body.innerHTML=`<div class="empty-state"><div class="big-ic">${ICON.check}</div>Fila concluída.<br>O progresso já foi salvo e os próximos intervalos foram calculados.</div><div class="nav"><button class="btn primary" id="doneBtn">Voltar</button></div>`;body.querySelector("#doneBtn").addEventListener("click",()=>{state.reviewSub="menu";render()});return}const c=q[state.flashPos],st=getItemState(s.id,"flashcards",c.id),label=c.diff==="facil"?"Fácil":c.diff==="medio"?"Médio":"Difícil";body.innerHTML=`<p class="page-sub">${state.flashPos+1} de ${q.length} · caixa ${st.box+1}/5</p><div class="card"><div class="q-meta"><span class="diff ${c.diff}">${label}</span></div><div class="flip-area" id="flipArea"><div class="flip-inner ${state.flashFlipped?"flipped":""}"><div class="face"><div class="label">Tente lembrar</div><div class="content">${c.front}</div></div><div class="face back"><div class="label">Resposta</div><div class="content">${c.back}</div></div></div></div><div class="tap-hint">Toque no card para ver a resposta</div>${state.flashFlipped?`<div class="flash-actions" style="margin-top:13px"><button class="rate-btn bad" id="rBad">Não lembrei</button><button class="rate-btn good" id="rGood">Lembrei</button></div>`:""}</div>`;body.querySelector("#flipArea").addEventListener("click",()=>{state.flashFlipped=!state.flashFlipped;render()});if(state.flashFlipped){body.querySelector("#rGood").addEventListener("click",async()=>{await rateItem(s.id,"flashcards",c.id,true);state.flashPos++;state.flashFlipped=false;render()});body.querySelector("#rBad").addEventListener("click",async()=>{await rateItem(s.id,"flashcards",c.id,false);state.flashPos++;state.flashFlipped=false;render()})}}
function renderKeywordsInto(container,s){const due=buildQueue(s,"keywords","due"),list=state.reviewFilter==="all"?s.keywords:due;container.innerHTML=`<div class="backrow"><button class="backbtn" id="backMenu">Revisar</button><span class="page-sub" style="margin:0">${state.reviewFilter==="due"?"pendentes":"todos"}</span></div><div class="review-mode-row"><button class="mode-chip ${state.reviewFilter==="due"?"active":""}" id="modeDue">Hoje (${due.length})</button><button class="mode-chip ${state.reviewFilter==="all"?"active":""}" id="modeAll">Todos (${s.keywords.length})</button></div><div id="kwList"></div>`;container.querySelector("#backMenu").addEventListener("click",()=>{state.reviewSub="menu";render()});container.querySelector("#modeDue").addEventListener("click",()=>{state.reviewFilter="due";render()});container.querySelector("#modeAll").addEventListener("click",()=>{state.reviewFilter="all";render()});const kwList=container.querySelector("#kwList");if(!list.length){kwList.innerHTML=`<div class="empty-state"><div class="big-ic">${ICON.check}</div>Nenhum conceito nessa fila.</div>`;return}list.forEach(kw=>{const st=getItemState(s.id,"keywords",kw.id),key=s.id+":"+kw.id,item=document.createElement("div");item.className="kw-item"+(state.kwOpen[key]?" open":"");item.innerHTML=`<div class="term"><span>${kw.term}</span><span class="box-chip">caixa ${st.box+1}/5</span><span class="chev">${ICON.chev}</span></div><div class="def">${kw.def}<div class="rate-row"><button class="rate-btn bad" data-r="bad">Não lembrei</button><button class="rate-btn good" data-r="good">Lembrei</button></div></div>`;item.querySelector(".term").addEventListener("click",()=>{state.kwOpen[key]=!state.kwOpen[key];item.classList.toggle("open",state.kwOpen[key])});item.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",async e=>{e.stopPropagation();await rateItem(s.id,"keywords",kw.id,b.dataset.r==="good");render()}));kwList.appendChild(item)})}

function renderDue(){const groups=SUBJECTS.map(s=>{const f=buildQueue(s,"flashcards","due"),k=buildQueue(s,"keywords","due");return{s,f,k,total:f.length+k.length}}).filter(g=>g.total>0),total=groups.reduce((n,g)=>n+g.total,0);content.innerHTML=`<h1 class="page-title">Pendências</h1><p class="page-sub">Aqui aparecem os itens que o sistema de revisão considera prioritários hoje.</p><div class="due-hero"><div class="n">${total}</div><div class="c">${total===1?"item":"itens"} para revisar</div></div><div id="dueGroups"></div>`;const wrap=document.getElementById("dueGroups");if(!total){wrap.innerHTML=`<div class="empty-state"><div class="big-ic">${ICON.check}</div>Você está em dia.<br>Para aprofundar, entre em uma matéria e pratique os conteúdos mesmo sem pendência.</div>`;return}groups.forEach(g=>{const box=document.createElement("div");box.className="due-group";const kind=g.f.length?"flash":"keywords";box.innerHTML=`<h3>${g.s.name}</h3><div class="due-row"><div><div class="n">${g.total} itens</div><div class="c">${g.f.length} flashcards · ${g.k.length} conceitos</div></div><button class="btn primary">Começar</button></div>`;box.querySelector("button").addEventListener("click",()=>{state.subjectId=g.s.id;state.subjectTab="review";state.reviewFilter="due";if(kind==="flash"){state.reviewSub="flash";startFlashQueue(g.s)}else state.reviewSub="keywords";state.tab="home";render()});wrap.appendChild(box)})}
function renderStats(){const due=totalDueCount(),total=meta.stats.totalReviews||0,streak=meta.stats.streakDays||0,all=SUBJECTS.reduce((n,s)=>n+s.flashcards.length+s.keywords.length,0),mastered=SUBJECTS.reduce((n,s)=>n+Math.round(allItems(s).filter(it=>srsBySubject[s.id]?.[it.kind]?.[it.id]?.box>=3).length),0);const pct=all?Math.round(mastered/all*100):0;content.innerHTML=`<h1 class="page-title">Progresso</h1><p class="page-sub">Use os números como sinalizadores. O que importa é conseguir explicar, prever e conectar os mecanismos.</p><div class="stats-overview"><div class="stats-tile"><div class="n">${pct}%</div><div class="l">domínio</div></div><div class="stats-tile"><div class="n">${due}</div><div class="l">pendentes</div></div><div class="stats-tile"><div class="n">${total}</div><div class="l">revisões</div></div></div><div class="section-h">Ritmo</div><div class="stats-card"><div class="head"><strong>Sequência</strong><span>${streak} dia${streak===1?"":"s"}</span></div><div class="prog-bar"><div style="width:${Math.min(streak*10,100)}%"></div></div><div class="progress-note">A sequência mede regularidade, não conhecimento. Um dia sem estudar não apaga o que você já aprendeu.</div></div><div class="section-h">Distribuição do domínio</div><div id="statsSubjects"></div>`;const wrap=document.getElementById("statsSubjects");SUBJECTS.forEach(s=>{const items=allItems(s),b=srsBySubject[s.id]||blankSubjectSrs(),counts=[0,0,0,0,0];items.forEach(it=>counts[b[it.kind][it.id]?.box??0]++);const card=document.createElement("div");card.className="stats-card";card.innerHTML=`<div class="head"><strong>${s.name}</strong><span>${subjectMasteryPct(s.id)}%</span></div><div class="bar-grid">${counts.map((c,i)=>`<div class="bar"><div class="fill ${i>=3?"mastered":""}" style="height:${items.length?Math.max(8,c/items.length*100):8}%"></div></div>`).join("")}</div><div class="bar-labels">${counts.map(c=>`<div>${c}</div>`).join("")}</div><div class="stats-caption">Caixa 1 a 5 · caixas 4 e 5 contam como domínio</div>`;wrap.appendChild(card)})}

/* keyboard shortcut during flashcards */
document.addEventListener("keydown",e=>{if(!state.subjectId||state.subjectTab!=="review"||state.reviewSub!=="flash")return;if(e.key===" "){const flip=document.querySelector("#flipArea");if(flip){e.preventDefault();flip.click()}}if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const id=e.key==="ArrowLeft"?"rBad":"rGood";const b=document.querySelector("#"+id);if(b){e.preventDefault();b.click()}}});
(async function boot(){content.innerHTML=`<div class="loading">Carregando seu progresso...</div>`;await loadAll();render()})();
</script></body></html>
